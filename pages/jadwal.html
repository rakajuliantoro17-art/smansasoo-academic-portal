<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F4C81">
    <title>Jadwal Pelajaran | SMAN 1 Sooko Mojokerto</title>
    <meta name="description" content="Jadwal pelajaran semester ganjil per kelas dan per hari, SMAN 1 Sooko Mojokerto.">

    <link rel="stylesheet" href="../css/shell.css">
    <link rel="stylesheet" href="../css/jadwal.css">
</head>

<body data-page="jadwal">

    <div id="shellNav"></div>

    <main class="jd">

        <section class="jd-panel" aria-labelledby="jdTitle">

            <h1 class="jd-title" id="jdTitle">Jadwal Pelajaran</h1>
            <p class="jd-sub" id="jdSub">Semester Ganjil, Tahun Pelajaran 2026/2027.</p>

            <div class="jd-controls">

                <div>
                    <label class="jd-label" for="jdKelas">Kelas</label>
                    <select class="jd-select" id="jdKelas"></select>
                </div>

                <div>
                    <span class="jd-label" id="jdHariLabel">Hari</span>
                    <div class="jd-pills" id="jdHari" role="group" aria-labelledby="jdHariLabel"></div>
                </div>

            </div>

        </section>

        <p class="jd-note" id="jdNote" hidden></p>

        <div id="jdResult" aria-live="polite"></div>

        <p class="jd-foot">
            <span class="jd-foot-box">
                <span id="jdDisahkan"></span>
                <a class="jd-link" href="../assets/docs/jadwal-pelajaran-ganjil-2026-2027.pdf" target="_blank" rel="noopener">Unduh PDF jadwal asli</a>
            </span>
        </p>

    </main>

    <div id="shellFooter"></div>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/shell.js"></script>
    <script src="../js/jadwal.js"></script>

</body>
</html>
